<!DOCTYPE html>
<html>
    <head>
        <title>my animal fact file</title>
        <style>
            body{
                background-color: bisque;
                font-family: 'Courier New', Courier, monospace;
                
            }
            .factfile{
                background-color: aquamarine;
                color: burlywood;
                width:260px;
                padding:25px;

                margin:30px;

            }
            .detail{
                background-color: bisque;
                border-radius: 5px;
               color:cadetblue;
                border:4px solid;            }
                .cool-fact{
                     background-color: bisque;
                border-radius: 3px;
               color:cadetblue;
                border:4px solid;
                border-radius: 5px;

                }
        </style>
    </head>
    <body>
      <div class="factfile">
        <h2>Snow Tiger</h2>
        <p class="detail">Type=Big cat</p>
<p class="detail">Live in:Mountain ranges of Central Asia.</p>
<p class="detail">Diet:Deer,Gots,and Wild Sheep.</p>
<p class="cool-fact"><b>Cool fact:</b> Can loap up to 15 metres in one jump!</p>
</div>
             </body>
</html>
