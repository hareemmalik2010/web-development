<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello World!</h1>
    <h1 id="myid"></h1>
    <h1 id="myid1"></h1>
    <h1 id="myid2"></h1>
    <h1 id="myid3"></h1>
    <script>
         var word ="coding"
         var a =word.toLocaleLowerCase()
         var b =word.toLocaleUpperCase()
         document.getElementById("myid").innerHTML=a;
         document.getElementById("myid1").innerHTML=b;
         var c=word.startsWith("c")
         document.getElementById("myid2").innerHTML=c;
         var d= Math.random()*100
         var e= Math.floor(d)
         document.getElementById("myid3").innerHTML=e;
    </script>
    
</body>
</html>
