<!doctype html>
<html>
    <head>
        <title>my doctor's appointment form</title>
    </head>
    <body>
        <h1>My doctor's appointment form</h1>
        <p>Fill in the form below to book your appointment</p>
        <form>
            <fieldset>
                <legend>Personal details</legend>
                <label>Your name</label><br>
                <input type="text" id="name" placeholder="Enter your full name"><br> <br>
                <label>Your password</label><br>
                <input type="password" id="pid" placeholder="Enter your password" ><br><br>
                <label>Date of birth</label><br>
                <input type="date" id="dob"><br><br>
             </fieldset><br>
             <fieldset>
                <legend>Your visit</legend>
                <label>Choose your doctor</label><br>
                <select id="doctor">
                    <option value="">Select doctor--</option>
                    <option value="dr.ibrahim">Dr.ibrahim</option>
                    <option value="dr.Iqra">Dr.Iqra</option>
                    <option value="dr.neelam">Dr.Neelam</option>
                </select><br><br>
                <label>Why are you visiting?</label><br>
                <input type="radio" name="reason" value="fever">Fever<br>
                <input type="radio" name="reason" value="cough">Cough<br>
                <input type="radio" name="reason" value="skin problem">Skin problem<br>
                <input type="radio" name="reason" value="malaria">Malaria<br><br>
                <label> Any notes for the doctor</label><br>
                 <textarea id="notes" rows="3" cols="35" placeholder="write a note?"></textarea>
                 </fieldset><br>
            <fieldset>
                <legend>Preffered visit day</legend>
                <input type="checkbox" value="monday">Monday<br>
                <input type="checkbox" value="tuesday">Tuesday<br>
                <input type="checkbox" value="wednesday">Wednesday<br>
                <input type="checkbox" value="thursday">Thursday<br>
                <input type="checkbox" value="friday">Friday
            </fieldset><br>
            <input type="submit" value="book my appointment">


        </form>

    </body>
</html>
