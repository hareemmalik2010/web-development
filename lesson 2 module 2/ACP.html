<!doctype html>
<html>
    <head>
        <title>My weather card</title>
        <style>
            body{
  
  background-image: radial-gradient(circle, white 2px, transparent 3px);
  background-size: 40px 40px;
  background-repeat: repeat;
  background-position: top center;
  background-attachment: fixed;

                background-color:rgb(116, 204, 239);
                
            }
            .weather{
                border-radius: 15px;
                background-color: aquamarine;
                width:350px;
                height:350;
                border:3px;
                color:cadetblue;
                text-align: center;
                
            }
            .Temperature{
                background-color: aquamarine;
                text-align: center;
                border-radius: 15px;
                width:350px;
                height:350px;
                border:3px;
            }
        </style>
    </head>
    <body>
        <h1>My Weather Web page</h1>
          <div class="weather">
        <h1> Today's Weather of my city</h1>
       
        <p>Temperature=33°C</p>
        <p>Day=Thursday</p>
        <p>Time=3:00pm</p>
        <p>Weather=Partly sunny</p>
        </div>
        <div class="Temperature">
            <h1>Temperature</h1>
            <p>Friday=23°Cto32°C</p>
            <p>Saturday=31°Cto24°C</p>
            <p>Sunday=30°Cto25°C</p>
            <p>Monday=28°Cto24°C </p>
            <p>Tuesday=27°Cto23°C</p>
            
        </div>
        <footer>
            Severe heat is expected in this area.
        </footer>

    </body>
</html>
