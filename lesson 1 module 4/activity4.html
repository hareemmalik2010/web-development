<!doctype html>
<html>
    <head>
        <title>operature</title>
    </head>
    <body>
        <h1>Operature</h1>
        <p>Subtraction</p>
        <p id="sub"></p>
        <p>Division</p>
        <p id="div"></p>
        <script>
            //subtraction
            var num1=10;
            var num2=5;
            var num= num1 -num2;
            document.getElementById("sub").innerHTML=num;
            //division
            var div=num1/num2;
            document.getElementById("div").innerHTML=div;
        </script>
    </body>
</html>
