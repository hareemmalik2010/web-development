<!DOCTYPE html>
<html>
    <head>
        <title>Create basic function in JS</title>
    </head>
    <body>
        <h1>Basic Function In JS</h1>
        <button onclick="myfunction(5)">Execute JS Function</button>
        <script>
            function myfunction(x,y)
            {
                if (y== undefined)
                {    y=2;
                }
                document.write(x*y);
            }
        </script>

    </body>
</html>
