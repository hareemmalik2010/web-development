<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loop in JS</title>
</head>
<body>
    <h1>Using Loop in JS:</h1>
    <p id="demo"></p>
    <script>
        var fruits=["Apple", "Mango", "Banana", "Grapes", "Watermelon",]
        var text="";
        var i;
        for (i=0;i<fruits.length;i++) {
            text += fruits [i] + "<br>";
        }
        document.getElementById("demo").innerHTML=text;
    </script>
    
</body>
</html>
