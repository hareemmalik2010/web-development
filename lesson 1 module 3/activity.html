<!doctype html>
<html>
    <head>
        <title>My Hobby card</title>
        <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <style>
            body{
                background-image: linear-gradient(to bottom, rgb(125, 22, 22), rgb(220, 109, 127));
                background-repeat:no-repeat;
               background-attachment: fixed;
                
            }
            h1{
                color: cadetblue;
                text-decoration: underline;
            }
            .hobby-card{
                background-color:cadetblue;
                border: 3px solid burlywood;
                color: brown;
                padding: 3px 3px;
               
                min-height: 130px;
                
            }
            h2{
                color:blanchedalmond;
            }
        </style>
    </head>
    <body>
<h1> My Hobby Cards</h1>
<br>
<div class="container">
    <div class="row">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="hobby-card">
                <h2>Badminton</h2>
                <p>I like to play badminton with my friends and enjoys a lot.</p>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
            <div class="hobby-card">
                <h2>Cooking</h2>
                <p>I like cooking .</p>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
            <div class="hobby-card">
                <h2>Sleeping</h2>
                <p>I love sleeping.</p>
            </div>
        </div>

    </div>
</div>

    </body>
</html>
