<!doctype html>
<html>
    <head>
        <title>My super hero card</title>
        <style>
            body{
                background-color: aqua;
                text-align:center;
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                color:brown;
            }
            .hero-name{
                font-size: 60px;
                font-weight:bold;
                color:cadetblue;
                text-shadow: 3px 3px darkgray;
                text-decoration: underline;
                text-transform: uppercase;
            }
            .powers{
                font-weight: bold;
                color:rgb(80, 76, 76);
                text-transform: capitalize;
            }
            .name{
                color:white;
                text-transform: capitalize; 
                font-size:bold;         
                text-decoration:line-through;    
                         
            }
            .power{
                color:white;
            }
            .badge{
            transform:rotate(180deg);
            font-size: bold;

            
            }
            .weakpoint{
                color:white;
            }
            .weaknessess{
                color:rgb(71, 65, 65);
                font-size: 30px;
            }
            .madeby{
                font-size: larger;
                color:blue
            }


        </style>
    </head>
    <body>

<h1 class="hero-name">Thunder Kid </h1>
<p class="name">The most powerful hero in the school.</p>
<h2 class="powers"> Super hero</h2>
<p class="power">he can lift the car.</p>
<p class="power">he can run with a speed more than cheetah.</p>
<h2 class="weaknessess"> Weaknessess</h2>
<p class="weakpoint">Math homework </p>
<p class="weakpoint">English Grammer</p>
<p class="badge">top hero</p>

<p class="madeby">Created by Hareem Fatima</p>
    </body>
</html>
